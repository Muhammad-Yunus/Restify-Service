run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gci
    - misspell
    - unparam
    - unconvert
    - predeclared
    - nosprintfhostport
    - bodyclose
    - contextcheck
    - dogsled
    - durationcheck
    - wrapcheck
    - wsl

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/muhammadyunus/Restify-Service)
  revive:
    rules:
      - name: exported
        arguments: ["disableStutteringCheck"]
      - name: package-comments
        disabled: true
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-naming
      - name: if-return
  wrapcheck:
    ignoreSigs:
      - fmt.Errorf
      - errors.New
  errcheck:
    check-type-assertions: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - govet
    - path: mocks
      linters:
        - errcheck
